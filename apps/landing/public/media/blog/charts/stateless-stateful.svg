<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 560' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='1200' height='560' fill='#ffffff'/><text x='40' y='56' fill='#1C2333' font-size='26' font-weight='600'>Where the data goes after the agent asks</text><rect x='40' y='100' width='520' height='190' rx='14' fill='#F4F6FB' stroke='#E4E8F0' stroke-width='2'/><text x='64' y='136' fill='#1C2333' font-size='20' font-weight='600' text-anchor='start'>Stateless</text><text x='64' y='162' fill='#5B6478' font-size='16' font-weight='400' text-anchor='start'>Treg, Deepline, Landbase, Orthogonal</text><rect x='64' y='190' width='150' height='70' rx='14' fill='#ffffff' stroke='#E4E8F0' stroke-width='2'/><text x='139' y='222' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>Agent asks</text><text x='139' y='244' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>for data</text><path d='M216 225 h10' stroke='#98A1B5' stroke-width='2'/><rect x='229' y='190' width='150' height='70' rx='14' fill='#ffffff' stroke='#E4E8F0' stroke-width='2'/><text x='304' y='222' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>Data comes</text><text x='304' y='244' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>back</text><path d='M381 225 h10' stroke='#98A1B5' stroke-width='2'/><rect x='394' y='190' width='150' height='70' rx='14' fill='#ffffff' stroke='#E4E8F0' stroke-width='2'/><text x='469' y='222' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>You own it.</text><text x='469' y='244' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>The story ends.</text><rect x='640' y='100' width='520' height='190' rx='14' fill='#F4F6FB' stroke='#E4E8F0' stroke-width='2'/><text x='664' y='136' fill='#1C2333' font-size='20' font-weight='600' text-anchor='start'>Stateful</text><text x='664' y='162' fill='#5B6478' font-size='16' font-weight='400' text-anchor='start'>Clay, Floqer, Bitscale</text><rect x='664' y='190' width='472' height='70' rx='14' fill='#ffffff' stroke='#E4E8F0' stroke-width='2'/><text x='900' y='222' fill='#1C2333' font-size='15' font-weight='500' text-anchor='middle'>Tables, schedules, signals, webhooks</text><text x='900' y='244' fill='#5B6478' font-size='15' font-weight='400' text-anchor='middle'>built for people clicking</text><rect x='40' y='330' width='1120' height='190' rx='14' fill='#EEF1FD' stroke='#3B49E0' stroke-width='2'/><text x='64' y='366' fill='#3B49E0' font-size='20' font-weight='600' text-anchor='start'>pipe0: both, on one engine</text><rect x='64' y='400' width='500' height='90' rx='14' fill='#ffffff' stroke='#C8DDF6' stroke-width='2'/><text x='314' y='438' fill='#1C2333' font-size='16' font-weight='500' text-anchor='middle'>Stateless blocks: searches and pipes</text><text x='314' y='462' fill='#5B6478' font-size='15' font-weight='400' text-anchor='middle'>one call, data back to the agent</text><rect x='636' y='400' width='500' height='90' rx='14' fill='#ffffff' stroke='#C8DDF6' stroke-width='2'/><text x='886' y='438' fill='#1C2333' font-size='16' font-weight='500' text-anchor='middle'>A pipe0 sheet: up to 2M rows</text><text x='886' y='462' fill='#5B6478' font-size='15' font-weight='400' text-anchor='middle'>schedules, signals, webhooks, team review</text><path d='M566 445 h62' stroke='#3B49E0' stroke-width='3'/><path d='M622 437 l10 8 l-10 8' fill='none' stroke='#3B49E0' stroke-width='3'/><text x='600' y='392' fill='#3B49E0' font-size='15' font-weight='500' text-anchor='middle'>"write this to a pipe0 sheet"</text></svg>